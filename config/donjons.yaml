# Donjons candidats pour le farm en équipe (12/10). Conception et explications : docs/rapports/donjons.md.
# Pas encore lu par le bot.
#
# Chaque valeur est écrite {valeur, source, a_verifier_en_jeu} :
#   source « client (...) » : langue du client Retro 1.49.6 copiée dans data/client_retro/lang, lue par
#     tools/langue_client.py ; entre parenthèses la table : DU donjons, HI indices de la carte du monde, MA cartes
#     (p1, p2 : cases de placement), I objets, CR recettes, M monstres, N PNJ, D dialogues (q = texte du PNJ,
#     a = réponse du joueur). Données officielles.
#   source « web N » : page N de « sources.web » (Dofus Retro / 1.29 seulement), relevée par un agent de recherche.
#   source « déduction » : raisonnement sur les données, pas écrit tel quel.
#   source « à apprendre » : à relever sur capture ou par le bot à la première visite.
#   a_verifier_en_jeu : non = donnée du client ; oui = à confirmer en jeu ou sur capture.

