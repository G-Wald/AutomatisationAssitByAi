# -12 %. Après le boss : 11891, Bibiblop (case 344), q5410 : « Sortir du donjon » (4540).
blops:
  nom: Donjon des Blops   # nom exact du donjon (table DU), comme dans config/donjons_cles.yaml
  monde: douze
  carte: [-25, -17]
  carte_dehors: 4416
  entree: [14, 24]        # case 355 de 4416 (StarLoco : moveEndTeleport(11878, 365)), à vérifier en jeu
  pnj: [25, 5]            # case 85 de 11878 (StarLoco) ; celle du serveur passe avant (pnj_modele)
  pnj_carte: 11878
  pnj_modele: 1034        # Bibiblop
  reponse: Donner la clef
  reponse_id: 4531
  trousseau: Utiliser le trousseau de clefs
  salles: 8               # 7 salles, puis le Blop royal choisi
  choix_apres: 7
  choix_pnj: [5, 13]      # case 191 de 11886 (StarLoco)
  choix_reponse: Choisir la salle du Blop Indigo Royal
  pnj_fin: [21, 23]       # case 344 de 11891 (StarLoco)
  reponse_fin: Sortir du donjon
  clic_fin: gauche
  zone_cles: [-25, -17]   # Massif de Cania : Blops (butin de la clé à vérifier)
