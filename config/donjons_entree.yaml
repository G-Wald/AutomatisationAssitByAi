# Chemin d'entrée des donjons, case par case, lu par bot/team/dungeon.py (cases de la grille de combat, comme les
# soleils des cartes). Recherche sur les donjons candidats au farm (sources, données du client) : config/donjons.yaml.
# Incarnam (18/10, captures et explications de l'utilisateur) : la grotte sur la carte 6,5 (sous-zone Divers) mène à
# « Incarnam (Donjon) » aux mêmes coordonnées. Une dalle à fouler (un seul personnage suffit) déplace la pierre qui
# bloquait le soleil de la salle suivante ; là, Ma'ster Donge prend la clef de chaque personnage (chacun en a une sur
# lui) et le fait entrer.
incarnam:
  nom: Donjon d'Incarnam
  monde: incarnam
  carte: [6, 5]           # carte extérieure où est l'entrée
  entree: [16, 14]        # soleil de la grotte (config/monde/incarnam.json : « autres » de 6,5)
  dalle: [18, 20]         # première dalle de la salle d'entrée
  soleil: [23, 5]         # soleil libéré par la pierre (en haut à droite), vers la salle de Ma'ster Donge ;
                          # (13, 7), en haut à gauche dans le rayon de lumière, ramène dehors
  pnj: [20, 14]           # Ma'ster Donge, devant la porte (ses pieds ; son corps 35 px au-dessus)
  reponse: Voici la clef de la porte   # sa réponse, ligne entière
  salles: 4               # salles à combattre, la dernière celle du boss Milimilou (18/10 : 4 combats)
  # Salle de fin (après le boss Milimilou) : Ma'ster Donge de nouveau ; clic droit, « A la sortie. » ramène dehors
  # en 6,5, devant la grotte (« A l'auberge. » : ailleurs).
  pnj_fin: [21, 11]
  reponse_fin: A la sortie
  clic_fin: droit

# Bouftou (30/10, trajet et dialogue écoutés au réseau) : Altaïr se tient dehors, en 2,-34 (Taïnéla, Le Berceau ; carte
# 1856), devant la porte, sans grotte ni dalle. Trajet depuis Astrub : zaap 4,-19 -> Le Berceau 1,-32, puis 2,-32, 2,-33,
# 2,-34 à pied. Dialogue : « DCK-1 », une seule question (DQ660) et deux réponses, « Donner la clé des bouftous. »
# (564) et « Utiliser le trousseau de clefs. » (6602). Salles (référence du client, data/donjons.json) : cartes 2073 à
# 2084, 11 salles, 8 places par équipe, la 11e marquée « sortie ».
bouftou:
  nom: Donjon Bouftou
  monde: douze
  carte: [2, -34]
  pnj: [18, 14]           # Altaïr, case 212 annoncée par le serveur (GM|+212;...;-1;174;-4)
  pnj_carte: 1856         # chacun situé devant Altaïr par la carte annoncée par le serveur
  reponse: Donner la clé des bouftous   # ligne entière de sa bulle
  reponse_id: 564         # réponse « clé » du serveur (DQ660|564;6602) : proposée seulement à qui a la clé
  trousseau: Utiliser le trousseau de clefs   # 31/10 : entrée sans clé (trousseau), proposée à tous
  trousseau_id: 6602
  # Salles (30/10, au réseau) : un groupe par salle, la victoire téléporte dans la suivante (GDM 2074 puis 2075), sans
  # marcher. Donjon partagé : d'autres joueurs y passent et prennent le groupe (« GM|--1 »), qui réapparaît ensuite.
  salles: 10              # 30/10 : 10 combats, le Bouftou Royal dans la 10e (carte 2083) ; la 11e (2084) est la salle de fin
  # Salle de fin (carte 2084) : Altaïr (modèle 177, case 255), clic gauche, « Parler » ; une question (DQ677), une
  # réponse, « Accepter la récompense » (605) : un familier offert.
  pnj_fin: [17, 17]
  reponse_fin: Accepter la récompense
  clic_fin: gauche

# Donjon des Champs (05/11, observé au réseau avec Fourboun, rien consommé) : Mawy Ingalsse (modèle 780) se tient dehors,
# en 7,-25 (carte 7453), case 187 ; clic gauche, menu « Parler », une question (DQ3178) et deux réponses :
# « Donner la clef et rentrer » (2802, à qui a la Clef des Champs) et « Utiliser le trousseau de clefs. » (6615). La porte
# en (18,12) mène à un atelier (carte 7613, Emia Elliesol) : pas l'entrée du donjon.
# Salles (référence du client, data/donjons.json) : 9768 à 9774 (7 combats, Tournesol Affamé dans la 7e), puis 9786,
# salle de fin. Salle 3 : 3 places de joueurs, salle 5 : 4 (client, MA p1) : une équipe de 8 ne peut pas tout combattre.
# Sortie (données StarLoco locales, à vérifier en jeu) : case 260 de 9786, soit (27,17).
champs:
  nom: Donjon des champs  # nom exact du donjon (table DU), comme dans config/donjons_cles.yaml
  monde: douze
  carte: [7, -25]
  pnj: [26, 12]
  pnj_carte: 7453
  reponse: Donner la clef et rentrer
  reponse_id: 2802
  trousseau: Utiliser le trousseau de clefs
  trousseau_id: 6615
  salles: 7
  sortie_case: [27, 17]
