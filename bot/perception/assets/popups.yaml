# Fenêtres connues et comment les fermer, dans l'ordre où les traiter (celle du dessus d'abord).
# Les images sont des découpes de captures, rangées dans ce dossier.
#
# - name: fin_de_combat          nom affiché dans le journal
#   detect: fin_de_combat.png    morceau de la fenêtre qui la reconnaît (son titre par exemple)
#   close: fin_de_combat_x.png   bouton à cliquer pour la fermer
#   key: escape                  ou, à la place de close, touche qui la ferme
#   threshold: 0.85              ressemblance minimale (0 à 1), facultatif
#   detect_also: [autre.png]     autres modèles du titre (autre qualité graphique), facultatif
#   pair_threshold: 0.8          titre OU bouton au seuil suffit si l'autre atteint ce score, facultatif

popups:
  - name: informations (niveau supérieur)
    detect: informations_titre.png      # titre « Informations » ; s'ouvre par-dessus le résultat du combat (20/10 :
                                        # « Tu passes niveau 14 », à fermer avant le résultat)
    close: informations_ok.png          # bouton « Ok »
  - name: résultat du combat
    detect: fin_de_combat_titre.png     # « Résultat du combat » (sans le nombre de tours, qui varie)
    detect_also: [fin_de_combat_titre_2.png]  # le même, découpé le 20/10 (journal 201321, capture 0021, fenêtre de
                                              # 1057 px) : 0,874 avec le premier, pas reconnu en jeu
    pair_threshold: 0.8                 # titre ou bouton à 0,85 suffit si l'autre dépasse 0,80 (autres fenêtres des
                                        # tests : titre à 0,55 au plus)
    close: fin_de_combat_fermer.png     # bouton « Fermer » sous la fenêtre
  - name: échange
    detect: echange_fleches.png         # double flèche entre les deux moitiés de la fenêtre d'échange (25/10, Pombro :
                                        # échange proposé par un autre joueur, ouvert à la connexion ; la carte et
                                        # « /p » illisibles dessous, le bot arrêté). Échap = refuser, jamais « Accepter »
    key: escape
  - name: menu principal
    detect: menu_principal_titre.png    # « Menu principal » : Échap sans rien à fermer l'ouvre (11/10, un suiveur)
    key: escape                         # Échap = « Annuler » ; jamais de clic : « Quitter Dofus » et « Déconnecter »
                                        # sont juste au-dessus
  - name: combats en cours
    detect: combats_en_cours_titre.png  # « Combats en cours » (liste pour regarder un combat) : ouverte par un clic sur
                                        # l'épée du combat d'un autre joueur (16/10, Incarnam 6,1) ; bloquait le bot
    title_above: 400                    # seul le bas de la fenêtre est du beige des fenêtres : titre 340 px plus haut
    close: fin_de_combat_fermer.png     # bouton « Fermer », le même que sous le résultat du combat
  - name: challenge en cours
    detect: challenge_en_cours_titre.png  # « Challenge en cours » (16/10, en combat, Incarnam 6,2) : cachait la carte de
                                          # Dinarpepe, ni ennemi ni personnage vus, l'équipe bloquée 14 min
    close: challenge_fermer_x.png         # croix orange en haut à droite de la fenêtre
  - name: options
    detect: options_titre.png           # « Options » du jeu : ouverte par l'entrée « Options » du menu de Flash (18/10,
                                        # clic droit du donjon sur une case sans PNJ, le milieu du menu cliqué)
    close: fin_de_combat_fermer.png     # bouton « Fermer » sous la fenêtre
